# Hookah Shop on Tower: /mnt/cache/appdata/hookah-shop/compose.yaml, with .env
# (MODERNMT_API_KEY) and data/ next to it. Registered as the "Hookah Shop"
# stack in Unraid's Compose Manager (projects/hookah_shop points here).
#   docker compose up -d        start / apply changes to this file
# New images come from GitHub Actions (public package ghcr.io/dkubatko/hookah-view);
# this stack's own Watchtower pulls them.
name: hookah_shop
services:
  hookah-shop:
    image: ghcr.io/dkubatko/hookah-view:latest
    container_name: hookah-shop
    env_file: .env
    environment:
      TZ: America/New_York
    user: "99:100"           # Unraid's nobody:users, so appdata stays editable
    volumes:
      - ./data:/data         # catalog, raw data, translations cache, overrides, history
    ports:
      - "192.168.1.196:15001:8440"   # Nginx Proxy Manager forwards shop.3rdplacelounge.com here
    mem_limit: 512m
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=hookah-shop
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=/mnt/cache/appdata/hookah-shop/icon.svg
      - net.unraid.docker.webui=https://shop.3rdplacelounge.com/
    restart: unless-stopped

  # Checks GitHub's registry every minute and restarts Hookah Shop on a new image.
  # --scope hookah-shop: it only touches containers with that scope label, and
  # unscoped Watchtowers (e.g. Pond Battle's) ignore scoped containers, so the
  # two apps' deployments stay separate.
  # (nickfedor's fork: the original containrrr/watchtower no longer works with Docker 29.)
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: hookah-shop-watchtower
    command: --label-enable --scope hookah-shop --interval 60 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - com.centurylinklabs.watchtower.scope=hookah-shop
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=/mnt/cache/appdata/hookah-shop/icon.svg
    restart: unless-stopped
