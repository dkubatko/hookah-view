# Every push to main runs the tests, builds the image and publishes it to
# GitHub's registry; Watchtower on Tower pulls the new :latest within minutes.
name: Docker image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync && uv run pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/dkubatko/hookah-view:latest
            ghcr.io/dkubatko/hookah-view:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
